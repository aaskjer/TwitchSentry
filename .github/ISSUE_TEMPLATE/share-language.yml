name: Share a complete translation file
description: A whole language, ready to use or brought up to date after an update
title: "Language: "
labels: ["share: language"]
body:
  - type: markdown
    attributes:
      value: |
        **For a language TwitchSentry does not have yet, or to catch an existing one up** after an update added new English text. A single line that reads badly is a smaller fix - use *Suggest a better translation* for that instead.

        **A pull request is opened for this automatically,** into the [`submissions` branch](https://github.com/aaskjer/TwitchSentry/tree/submissions), and once it is merged this ticket is closed. Every install can download the language once it is published into `Language/` on `main`; the pull request that does that mentions this ticket.

        **The settings window and the chat messages are two separate files,** each language in both. A chat language is written against [`Language/Chat/en.json`](https://github.com/aaskjer/TwitchSentry/blob/main/Language/Chat/en.json) and keeps every placeholder such as `{user}` exactly as it is.

        **The file itself does not fit in a text box** - drag it into the *Language file* field below rather than pasting its text; GitHub turns the drop into a link, and that is what the check reads. It does not need to translate every text: whatever is left in English stays that way until somebody fills it in, the same as any other language.

  - type: dropdown
    id: translates
    attributes:
      label: What does the file translate?
      options:
        - The settings window
        - Chat messages
    validations:
      required: true

  - type: input
    id: language-name
    attributes:
      label: Language name
      description: As it should appear in the Change Language window, in that language.
      placeholder: Italiano
    validations:
      required: true

  - type: input
    id: language-code
    attributes:
      label: Language code
      description: it, or something like pt-BR for a regional one.
      placeholder: it
    validations:
      required: true

  - type: input
    id: credit
    attributes:
      label: Credit (optional)
      description: How you would like to be named for this. Left blank, your GitHub username is used.

  - type: textarea
    id: file
    attributes:
      label: Language file
      description: Drag the finished `.json` file in here (or use the paperclip below the box). Exported from a working install, or written by hand against `Language/en.json` (the window) or `Language/Chat/en.json` (chat messages).
    validations:
      required: true

  - type: checkboxes
    id: privacy
    attributes:
      label: Before you submit
      options:
        - label: This is my own translation of TwitchSentry's English text, or one I checked myself - not unread machine output.
          required: true
