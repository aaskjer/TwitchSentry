name: Something is broken
description: TwitchSentry does something it should not, or does not do something it should
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        **The settings window fills most of this in for you.** ☰ → *Report an issue or idea…* opens
        GitHub with the summary, the description, the label and the setup block already typed in.
        Nothing is sent from the window - you still read it over here and press Submit yourself.

  - type: dropdown
    id: area
    attributes:
      label: Which part is it about?
      description: Not sure is a fine answer.
      options:
        - "Not sure"
        - "Message Filter"
        - "Spam Scoring and Learner"
        - "Raid Protection"
        - "Follow Protection"
        - "Link Filter and Check Link"
        - "AutoMod"
        - "Twitch Warn"
        - "Permits"
        - "Voting"
        - "Discord Alerts"
        - "The settings window"
        - "A translation"
    validations:
      required: true

  - type: textarea
    id: what-happened
    attributes:
      label: What happened, and what did you expect instead?
      description: What you did, what you expected, and what happened instead.
      placeholder: |
        A viewer posted a clip of my own channel and the Link Filter deleted it. I expected
        "Allow Twitch Clips" on the General Settings page to let it through.
    validations:
      required: true

  - type: textarea
    id: setup
    attributes:
      label: Your setup
      description: |
        The block the settings window writes for you, or as much of it as you can fill in by hand.
        It never contains your channel name, your API keys, your webhook URL or any file path - the
        keys are named as *set* or *not set*. Please keep it that way.
      render: text
    validations:
      required: true

  - type: textarea
    id: status-log
    attributes:
      label: Anything from the Status Log page
      description: |
        *Results → Status Log* in the settings window. It opens on **Problems only**, and that is
        where TwitchSentry says what it could not do - a key still on its placeholder, a download
        that failed, an action Twitch refused. One line from it is often the whole answer.
      render: text

  - type: checkboxes
    id: before
    attributes:
      label: Before you send
      options:
        - label: I had a look at the open issues and this does not look like one of them
          required: true
