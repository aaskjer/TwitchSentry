# Takes accounts off the shared bot list when a removal ticket arrives (.github/ISSUE_TEMPLATE/botlist-removal.yml).
# The relay removes them and writes the botlist branch before it answers; .github/scripts/botlist_removal.py
# then says on the ticket what came off and closes it.
#
# Anyone with a GitHub account can open these tickets, so everything in one is untrusted. The script reads
# the ticket from the event file itself; nothing from the ticket is ever written into a command on this page.

name: Bot list removals

on:
  issues:
    types: [opened, edited]

permissions:
  contents: read
  issues: write

concurrency:
  group: botlist-removal-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  removal:
    if: github.event.issue.state == 'open' && contains(github.event.issue.labels.*.name, 'botlist: removal')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Take the accounts off the list
        env:
          GH_TOKEN: ${{ github.token }}
          BOTLIST_REMOVAL_KEY: ${{ secrets.BOTLIST_REMOVAL_KEY }}
        run: python3 .github/scripts/botlist_removal.py
